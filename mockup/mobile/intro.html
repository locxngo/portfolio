<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Alexander Rhoades - Portfolio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a1a1a",
                        "background-light": "#f7f7f7",
                        "background-dark": "#191919",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white text-slate-900 font-display selection:bg-primary/10">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Top Navigation Bar -->
<nav class="flex items-center bg-white dark:bg-background-dark p-4 border-b border-slate-100 dark:border-slate-800 justify-between sticky top-0 z-50">
<div class="text-primary dark:text-slate-100 flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-2xl">menu</span>
</div>
<div class="flex-1 px-4">
<h2 class="text-primary dark:text-slate-100 text-lg font-extrabold leading-tight tracking-tight uppercase">AR</h2>
</div>
<div class="flex items-center justify-end">
<button class="bg-primary dark:bg-slate-100 text-white dark:text-primary px-4 py-1.5 rounded-full text-sm font-bold tracking-tight hover:opacity-90 transition-opacity">
                    Resume
                </button>
</div>
</nav>
<!-- Main Hero Content -->
<main class="flex-1 flex flex-col justify-center px-6 py-12">
<div class="max-w-md">
<h1 class="text-primary dark:text-slate-100 tracking-tighter text-[52px] font-extrabold leading-[1.05] mb-8">
                    Alexander<br/>Rhoades
                </h1>
<div class="w-12 h-1 bg-primary dark:bg-slate-100 mb-8"></div>
<p class="text-slate-700 dark:text-slate-300 text-xl font-medium leading-relaxed max-w-xs">
                    Product Designer &amp; Creative Strategist focusing on minimalist digital experiences and bold visual identities.
                </p>
<div class="mt-12">
<button class="flex items-center gap-2 text-primary dark:text-slate-100 font-bold text-sm tracking-widest uppercase group">
                        View Projects
                        <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Footer Navigation Controls -->
<footer class="bg-white dark:bg-background-dark border-t border-slate-100 dark:border-slate-800 p-6">
<div class="flex items-center justify-between max-w-md mx-auto">
<!-- Horizontal Navigation -->
<div class="flex items-center bg-slate-50 dark:bg-slate-900 rounded-full p-1">
<button aria-label="Previous Page" class="w-12 h-12 flex items-center justify-center text-primary dark:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="w-px h-6 bg-slate-200 dark:bg-slate-700"></div>
<button aria-label="Next Page" class="w-12 h-12 flex items-center justify-center text-primary dark:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Page Indicator -->
<div class="text-xs font-bold text-slate-400 tracking-widest uppercase">
                    01 / 05
                </div>
<!-- Vertical Navigation -->
<div class="flex items-center bg-slate-50 dark:bg-slate-900 rounded-full p-1">
<button aria-label="Scroll Up" class="w-12 h-12 flex items-center justify-center text-primary dark:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">expand_less</span>
</button>
<div class="w-px h-6 bg-slate-200 dark:bg-slate-700"></div>
<button aria-label="Scroll Down" class="w-12 h-12 flex items-center justify-center text-primary dark:text-slate-100 hover:bg-white dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</footer>
</div>
</body></html>
